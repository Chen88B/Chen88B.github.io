<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beni Dev</title>
<style>
  :root {
    --bg: #0f0f14;
    --bg-soft: #16161d;
    --accent: #7c9aff;
    --accent-soft: #4b5bd9;
    --text: #f2f2f5;
    --muted: #9a9aa7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top, #1a1a24, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  .glow {
    position: fixed;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(124,154,255,0.25), transparent 70%);
    border-radius: 50%;
    top: -150px;
    left: -150px;
    filter: blur(40px);
    pointer-events: none;
  }

  header {
    text-align: center;
    padding: 3rem 1.5rem 1rem;
    z-index: 1;
  }

  header h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  header h1 span {
    color: var(--accent);
  }

  header p {
    margin-top: 0.8rem;
    color: var(--muted);
    font-size: 1.05rem;
  }

  .card {
    background: var(--bg-soft);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 2rem;
    max-width: 480px;
    margin: 2rem 1.5rem;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    z-index: 1;
    transition: transform 0.3s ease;
  }

  .card:hover {
    transform: translateY(-4px);
  }

  .card p {
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }

  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-soft));
    color: white;
    border: none;
    padding: 0.8rem 1.8rem;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 24px rgba(124,154,255,0.4);
  }

  #contador {
    margin-top: 1.2rem;
    font-size: 0.95rem;
    color: var(--muted);
  }

  #contador strong {
    color: var(--accent);
    font-size: 1.3rem;
  }

  footer {
    margin: 2rem 0 1rem;
    color: var(--muted);
    font-size: 0.85rem;
    z-index: 1;
  }
</style>
</head>
<body>

  <div class="glow"></div>

  <header>
    <h1>Hola, soy <span>Beni</span> 👋</h1>
    <p>Estudiante de Ingeniería en Software · UABC</p>
  </header>

  <div class="card">
    <p>Esta es una página sencilla hecha con HTML, CSS y JavaScript puro. Prueba el botón para ver algo de interactividad.</p>
    <button id="btn">Salúdame</button>
    <div id="contador">Clics: <strong id="num">0</strong></div>
  </div>

  <footer>Hecho con 💙 y código</footer>

  <script>
    const btn = document.getElementById('btn');
    const num = document.getElementById('num');
    let clicks = 0;

    const mensajes = [
      "¡Hola! 🎉",
      "¡Otra vez! 🚀",
      "Sigue así 💪",
      "¡Vas muy bien! ✨",
      "¡Código limpio, mente clara! 🧠"
    ];

    btn.addEventListener('click', () => {
      clicks++;
      num.textContent = clicks;
      btn.textContent = mensajes[clicks % mensajes.length];
    });
  </script>

</body>
</html>
